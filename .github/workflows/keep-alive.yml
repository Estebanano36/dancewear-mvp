name: Supabase Keep-Alive Ping

on:
  schedule:
    # Run every 3 days at 05:00 UTC (well within the 7-day inactivity limit)
    - cron: '0 5 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Request to Supabase REST API
        run: |
          echo "Pinging Supabase database to reset inactivity timer..."
          
          # Target project URL from Arabela configuration
          SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ceowgwlqvioljqpbxbqp.supabase.co' }}"
          ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
          
          if [ -n "$ANON_KEY" ]; then
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
              -H "apikey: $ANON_KEY" \
              -H "Authorization: Bearer $ANON_KEY" \
              "$SUPABASE_URL/rest/v1/costumes?select=id&limit=1")
            
            HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d: -f2)
            
            echo "Status Code: $HTTP_STATUS"
            echo "Response: $HTTP_BODY"
            
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo "✅ Supabase pinged successfully! Database is active."
            else
              echo "⚠️ Warning: Received HTTP status $HTTP_STATUS. Please verify your Supabase project status."
            fi
          else
            # Fallback direct health ping
            echo "Checking Supabase project health endpoint..."
            curl -s -I "$SUPABASE_URL/rest/v1/" | head -n 5
            echo "✅ Ping completed."
          fi
